name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/generate-snake.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate contribution graph animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?palette=github-dark&color_snake=cyan

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
